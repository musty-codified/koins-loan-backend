spring:
  application:
    name: koins-loan-backend

  security:
    user:
      name: devuser
      password: devpassword123

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 5s

  datasource:
    url: jdbc:postgresql://localhost:5432/koins_db
    username: ${DB_USERNAME:koins}
    password: ${DB_PASSWORD:koins_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update   # swap to 'validate' once Flyway migrations are in place
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-in-production-env}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${ADMIN_EMAIL:admin@koins.com}
    password: ${ADMIN_PASSWORD:Admin@Koins123!}
  loan:
    late-fee-rate: ${LATE_FEE_RATE:0.02}        # 2 % of total installment, charged once on transition to OVERDUE
    default-threshold: ${DEFAULT_THRESHOLD:3}    # consecutive overdue installments before loan is DEFAULTED
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:sk_test_replace_in_production}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

