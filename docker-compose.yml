version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: koins-postgres
    environment:
      POSTGRES_DB: koins_db
      POSTGRES_USER: koins
      POSTGRES_PASSWORD: koins_secret
    ports:
      - "5432:5432"
    volumes:
      - koins_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koins -d koins_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  koins_pgdata:
    driver: local
